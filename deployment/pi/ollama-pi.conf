# Copy to /etc/systemd/system/ollama.service.d/risarms-pi.conf after installing Ollama.
# The ollama account needs ownership of /srv/core/models.
[Unit]
After=srv-core.mount
BindsTo=srv-core.mount
RequiresMountsFor=/srv/core/models
ConditionPathIsMountPoint=/srv/core
StartLimitIntervalSec=120
StartLimitBurst=3

[Service]
Environment=OLLAMA_HOST=127.0.0.1:11434
Environment=OLLAMA_MODELS=/srv/core/models
Environment=OLLAMA_MAX_LOADED_MODELS=1
Environment=OLLAMA_NUM_PARALLEL=1
Environment=OLLAMA_CONTEXT_LENGTH=2048
Environment=OLLAMA_KEEP_ALIVE=60s
Environment=OLLAMA_NO_CLOUD=1
Nice=10
CPUQuota=200%
MemoryHigh=4G
MemoryMax=6G
TasksMax=128
Restart=on-failure
RestartSec=10
ExecStartPre=/usr/bin/python3 /opt/risarms/deployment/guard.py
EnvironmentFile=/etc/risarms/ollama.env
