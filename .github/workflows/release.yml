name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel (workflow_dispatch never publishes)"
        required: true
        default: beta
        type: choice
        options: [beta, stable]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate CORE release source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Derive and validate version
        id: meta
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          host = tomllib.loads(Path("CORE-HOST/pyproject.toml").read_text())["project"]
          client = tomllib.loads(Path("CORE-CLIENT/pyproject.toml").read_text())["project"]
          version = host["version"]
          if client["version"] != version:
              raise SystemExit("CORE-HOST and CORE-CLIENT versions differ")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Unsupported CORE version: {version}")

          manifest = json.loads(Path("compatibility.json").read_text())
          if manifest["version"] != version:
              raise SystemExit("compatibility.json version is out of date")
          if manifest.get("server_deployment", {}).get("distribution") != "void":
              raise SystemExit("compatibility.json must target Void Linux")
          if manifest.get("server_deployment", {}).get("architectures") != ["x86_64"]:
              raise SystemExit("compatibility.json must target x86_64")

          host_version = re.search(
              r'__version__ = "([^"]+)"', Path("CORE-HOST/core/version.py").read_text()
          ).group(1)
          if host_version != version:
              raise SystemExit(f"core/version.py {host_version} != pyproject {version}")

          ref = os.environ.get("GITHUB_REF_NAME", "")
          tag_channel = ""
          if ref.startswith("v"):
              tag = ref[1:]
              match = re.fullmatch(r"(\d+\.\d+\.\d+)(-beta\.\d+)?", tag)
              if not match:
                  raise SystemExit(f"Unsupported release tag: {ref}")
              if match.group(1) != version:
                  raise SystemExit(f"Tag {ref} does not match version {version}")
              tag_channel = "beta" if match.group(2) else "stable"

          channel = os.environ.get("INPUT_CHANNEL") or tag_channel or "stable"
          if channel not in {"stable", "beta"}:
              raise SystemExit(f"Unsupported channel: {channel}")
          if tag_channel == "beta" and channel == "stable":
              raise SystemExit("A beta tag cannot be published as stable")
          prerelease = "true" if channel != "stable" or tag_channel == "beta" else "false"
          if ref.startswith("v") and manifest.get("release_channel") != channel:
              raise SystemExit(
                  f"compatibility.json channel {manifest.get('release_channel')!r} "
                  f"does not match release channel {channel!r}"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as fh:
              fh.write(f"version={version}\nchannel={channel}\nprerelease={prerelease}\n")
          PY
      - name: Install and test CORE
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "CORE-HOST[test]" -e "CORE-CLIENT[test]" ruff
          ruff check --select F CORE-HOST/core CORE-HOST/tests CORE-CLIENT/client CORE-CLIENT/tests
          (cd CORE-HOST && python -m pytest -q --tb=no)
          (cd CORE-CLIENT && python -m pytest -q --tb=no)

  server:
    name: Build Void x86_64 server bundle
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e CORE-HOST -e services/RESCS cyclonedx-bom
      - name: Assemble server release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          set -euo pipefail
          name="CORE-Server-${VERSION}-void-x86_64"
          stage="release/${name}"
          mkdir -p "$stage" release
          cp -a CORE-HOST CORE-CLIENT services deployment compatibility.json "$stage/"
          if [ -f README.md ]; then cp README.md "$stage/"; fi
          if [ -f LICENSE ]; then cp LICENSE "$stage/"; fi
          cat > "$stage/INSTALL.txt" <<EOF
          CORE Server ${VERSION} (${CHANNEL})
          Target: Void Linux x86_64 glibc only
          Install: sudo ./deployment/void/install.sh
          Diagnose: sudo risarms-doctor
          Backup: sudo risarms-backup
          Upgrade: sudo ./deployment/void/upgrade.sh <new-release-directory>
          Rollback: sudo risarms-rollback
          The installer does not enable services automatically.
          Review /etc/risarms/*.env and /etc/caddy/risarms/portal.caddy first.
          EOF
          tar -czf "release/${name}.tar.gz" -C release "$name"
          rm -rf "release/$name"
          cyclonedx-py environment -o "release/sbom-${name}.cdx.json" --of JSON
          (cd release && sha256sum "${name}.tar.gz" "sbom-${name}.cdx.json" > SHA256SUMS)
          tar -tzf "release/${name}.tar.gz" | grep -F "${name}/deployment/void/install.sh" >/dev/null
          tar -tzf "release/${name}.tar.gz" | grep -F "${name}/services/RESCS" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: CORE-${{ needs.validate.outputs.version }}-void-x86_64
          path: |
            release/CORE-Server-*.tar.gz
            release/SHA256SUMS
            release/sbom-*.cdx.json
          if-no-files-found: error

  publish:
    name: Create draft GitHub release
    needs: [validate, server]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: CORE-*-void-x86_64
          merge-multiple: true
      - name: Verify release assets
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="release-notes.md"
          {
            printf 'CORE %s server release for Void Linux x86_64 glibc only.\n\n' "$VERSION"
            printf 'Channel: %s\n\n' "$CHANNEL"
            printf 'This is a source release archive. The Void hardware install, reboot, '\
            printf 'rollback, and storage-failure gates remain pending until a real Void '\
            printf 'host is available. No server update signature is claimed by this release.\n\n'
            printf 'Desktop builds are released separately from RISARMS-ui, where unsigned '\
            printf 'Windows and ad-hoc-signed, unnotarized macOS beta assets are expected '\
            printf 'until signing credentials are available.\n\n'
            printf 'Install from the extracted directory with:\n\n'
            printf '    sudo ./deployment/void/install.sh\n\n'
            printf 'See INSTALL.txt in the archive for upgrade, rollback, backup, and diagnostics commands.\n'
          } > "$notes"
          flags=(--draft --verify-tag --title "CORE ${VERSION} Void x86_64 (${CHANNEL})" --notes-file "$notes")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" release/* "${flags[@]}"
