name: CI
on:
  push:
    # Feature and fix branches are validated on push so a candidate commit has
    # evidence before a pull request exists.
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
jobs:
  core-host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: CORE-HOST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pip install ruff
      - run: ruff check --select E9,F,I core tests
      - run: python -m pytest -q --tb=no
  core-client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: CORE-CLIENT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pip install ruff
      - run: ruff check --select E9,F,I client tests
      - run: python -m pytest -q --tb=no
  core-host-windows:
    name: core-host (Windows, full)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CORE-HOST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pip install ruff
      - run: ruff check --select E9,F,I core tests
      - run: python -m pytest -q --tb=no
  core-client-windows:
    name: core-client (Windows, full)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CORE-CLIENT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pip install ruff
      - run: ruff check --select E9,F,I client tests
      - run: python -m pytest -q --tb=no

  platform-smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host and client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e CORE-HOST -e CORE-CLIENT
      - name: Verify installed commands from another directory
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          core-host --help
          core-host doctor --data "${{ runner.temp }}/core-data"
          core-client --help
          core-client doctor
